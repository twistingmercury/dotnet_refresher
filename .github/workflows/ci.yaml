name: Orders CI Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to Container Registry
        if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run containerized build
        id: build
        run: LOCAL=0 ./build/build.sh

      - name: Push image tags
        if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_TAGS: ${{ steps.build.outputs.image_tags }}
        shell: bash
        run: |
          if [[ -z "${IMAGE_TAGS}" ]]; then
            printf '%s\n' 'Error: the build did not report any image tags.' >&2
            exit 1
          fi
          while IFS= read -r image; do
            docker push "${image}"
          done <<< "${IMAGE_TAGS}"
