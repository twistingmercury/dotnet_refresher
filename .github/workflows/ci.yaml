name: Orders CI Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  actions: write
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run containerized build
        run: LOCAL=0 ./build/build.sh

      - name: Push image tags
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo 'dev')

          docker push ghcr.io/twistingmercury/orders:latest
          docker push ghcr.io/twistingmercury/orders:${VERSION}
         
  
    
