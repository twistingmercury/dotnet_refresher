services:
  orders_test_pg_db:
    build:
      context: ../../../database
      dockerfile: Dockerfile
    tmpfs:
      - /var/lib/postgresql

  orders_test_api:
    build:
      context: ../../..
      dockerfile: build/Dockerfile
      target: final
    image: ${ORDERS_API_IMAGE:-orders-api:blackbox}
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=orders_test_pg_db;Port=5432;Database=orders;Username=ordersUser;Password=ordersPass
    depends_on:
      orders_test_pg_db:
        condition: service_healthy

  orders_api_tests:
    build:
      context: ../../..
      dockerfile: src/Tests/BlackBox/Dockerfile
    environment:
      ORDERS_API_BASE_URL: http://orders_test_api:8080
    depends_on:
      orders_test_api:
        condition: service_started
